      function snake(x, y, s, phase, seedTurn) {
        const pts = [];
        for (let k = 0; k < 7; k++) pts.push([x + Math.sin(phase + k * 0.95) * 30 * s, y - k * 32 * s]);
        const d = "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
        const head = pts[6];
        return `<path d="${d}" fill="none" stroke="#141018" stroke-width="${52 * s}" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${d}" fill="none" stroke="#3FA34D" stroke-width="${38 * s}" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${d}" fill="none" stroke="#F5D547" stroke-width="${10 * s}" stroke-dasharray="${14 * s} ${18 * s}" stroke-linecap="round"/>
          <ellipse cx="${head[0]}" cy="${head[1] - 14 * s}" rx="${34 * s}" ry="${26 * s}" fill="#3FA34D" stroke="#141018" stroke-width="${7 * s}"/>
          <circle cx="${head[0] - 12 * s}" cy="${head[1] - 22 * s}" r="${7 * s}" fill="#141018"/><circle cx="${head[0] + 12 * s}" cy="${head[1] - 22 * s}" r="${7 * s}" fill="#141018"/>
          <path d="M${head[0]} ${head[1] + 8 * s} l0 ${16 * s} l-7 ${9 * s} M${head[0]} ${head[1] + 24 * s} l7 ${9 * s}" stroke="#C0262D" stroke-width="${5 * s}" fill="none" stroke-linecap="round"/>`;
      }
      function monkey(x, y, s, beat) {
        const up = Math.abs(Math.sin(beat * Math.PI));
        const by = y - up * 38 * s;
        const arm = (side, lift) =>
          `<path d="M${x + side * 38 * s} ${by - 60 * s} Q${x + side * 95 * s} ${by - (60 + lift) * s} ${x + side * 80 * s} ${by - (120 + lift) * s}" fill="none" stroke="#141018" stroke-width="${30 * s}" stroke-linecap="round"/>
           <path d="M${x + side * 38 * s} ${by - 60 * s} Q${x + side * 95 * s} ${by - (60 + lift) * s} ${x + side * 80 * s} ${by - (120 + lift) * s}" fill="none" stroke="#7A4A26" stroke-width="${18 * s}" stroke-linecap="round"/>`;
        return `${arm(-1, up * 60)}${arm(1, (1 - up) * 60)}
          <ellipse cx="${x}" cy="${by - 30 * s}" rx="${48 * s}" ry="${56 * s}" fill="#7A4A26" stroke="#141018" stroke-width="${7 * s}"/>
          <ellipse cx="${x}" cy="${by - 22 * s}" rx="${28 * s}" ry="${34 * s}" fill="#D9A877"/>
          <circle cx="${x - 50 * s}" cy="${by - 128 * s}" r="${22 * s}" fill="#D9A877" stroke="#141018" stroke-width="${7 * s}"/>
          <circle cx="${x + 50 * s}" cy="${by - 128 * s}" r="${22 * s}" fill="#D9A877" stroke="#141018" stroke-width="${7 * s}"/>
          <circle cx="${x}" cy="${by - 125 * s}" r="${48 * s}" fill="#7A4A26" stroke="#141018" stroke-width="${7 * s}"/>
          <ellipse cx="${x}" cy="${by - 115 * s}" rx="${33 * s}" ry="${28 * s}" fill="#D9A877"/>
          <circle cx="${x - 13 * s}" cy="${by - 130 * s}" r="${6 * s}" fill="#141018"/><circle cx="${x + 13 * s}" cy="${by - 130 * s}" r="${6 * s}" fill="#141018"/>
          <path d="M${x - 14 * s} ${by - 108 * s} Q${x} ${by - 96 * s} ${x + 14 * s} ${by - 108 * s}" fill="none" stroke="#141018" stroke-width="${5 * s}" stroke-linecap="round"/>`;
      }

      A.drive(tl, 3.4, (t) => {
        const frame = A.boil(t);
        const beat = t * 2.4;
        hair.setAttribute("d", A.hair({ ...skull, len: 0.5, seed: 40 + (frame % 3) }));
        animals.innerHTML =
          snake(330, 980, 1.45, beat * Math.PI, 1) + monkey(590, 960, 1.3, beat) +
          monkey(1110, 965, 1.3, beat + 0.5) + snake(1380, 990, 1.45, beat * Math.PI + 2, 2);
        const breath = 1 + Math.sin(t * 3) * 0.008;
        kid.setAttribute("transform", `translate(770 640) scale(${0.66 * breath} ${0.66 / breath})`);
      });
      tl.fromTo("#chambre-box", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.25, ease: "power4.out" }, 0.25);
      tl.to("#chambre-glow", { opacity: 1, duration: 0.12, ease: "power2.in" }, 2.55);
      tl.to("#chambre-shafts", { opacity: 0.6, duration: 0.12, ease: "power2.in" }, 2.55);

      tl.fromTo("#chambre-bang", { opacity: 0, scale: 0.4, transformOrigin: "1030px 300px" }, { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(2.2)" }, 2.7);
      window.__timelines["chambre"] = tl;
    })();

        let halo = `<ellipse cx="1160" cy="70" rx="175" ry="34" fill="none" stroke="#FFD23F" stroke-width="10"/>`;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2 + t * 2.2;
          const x = 1160 + Math.cos(a) * 175;
          const y = 70 + Math.sin(a) * 34;
          const s = 15 + Math.sin(a) * 5;
          halo += `<path d="M${x} ${y - s * 1.6} L${x + s * 0.45} ${y - s * 0.45} L${x + s * 1.6} ${y} L${x + s * 0.45} ${y + s * 0.45} L${x} ${y + s * 1.6} L${x - s * 0.45} ${y + s * 0.45} L${x - s * 1.6} ${y} L${x - s * 0.45} ${y - s * 0.45}Z" fill="#FFD23F" stroke="#141018" stroke-width="4"/>`;
        }
        els.halo.innerHTML = halo;
        bandsPattern().setAttribute("patternTransform", `translate(0 ${-(t * 260) % 70})`);

        const rise = Math.min(1, Math.max(0, (t - 0.3) / 2.6));

        const y = 860 - ease * 300;
        els.kid.setAttribute("transform", `translate(${1150 + Math.sin(t * 2) * 14} ${y}) rotate(${-8 + ease * 30}) scale(0.24)`);

        els.go.setAttribute("transform", `translate(${(g() - 0.5) * 8} ${(g() - 0.5) * 8})`);

    <script>
(function () {
      const A = Anime;
      const tl = gsap.timeline({ paused: true });
      const TOUCH = 3.8;
      document.getElementById("aldebaran-defs").innerHTML = A.tone("aldebaran-tone", 12, 2.6) + A.stripes("aldebaran-pj", 40, -8);

      const skull = A.skull("neutre");
      const $ = (k) => document.getElementById("aldebaran-" + k);
      const els = { streaks: $("streaks"), lines: $("lines"), spots: $("spots"), hair: $("kid-hair"), kid: $("kid"), burst: $("burst"), cam: $("cam"), a: $("star-a"), b: $("star-b"), c: $("star-c") };
      const seeds = A.rng(77);
      const rays = Array.from({ length: 140 }, () => ({ a: seeds() * Math.PI * 2, d: seeds() * 1200, v: 500 + seeds() * 1400 }));

      A.drive(tl, 4.5, (t) => {
        const frame = A.boil(t);
        if (t < 1.95) {
          let d = "";
          for (const r of rays) {
            const dist = (r.d + t * r.v) % 1300;
            const len = 20 + dist * 0.35;
            const x0 = 960 + Math.cos(r.a) * dist, y0 = 540 + Math.sin(r.a) * dist;
            d += `M${x0.toFixed(1)} ${y0.toFixed(1)}L${(x0 + Math.cos(r.a) * len).toFixed(1)} ${(y0 + Math.sin(r.a) * len).toFixed(1)}`;
          }
          els.streaks.setAttribute("d", d);
          els.streaks.setAttribute("stroke-width", "5");
          els.lines.setAttribute("d", A.speedLines({ count: 70, inner: 420, seed: 900 + frame, width: [1, 4] }));
          const grow = Math.min(1, t / 1.7);
          const g = grow * grow;
          const R = 60 + g * 640;
          const cx = 960 + g * 620;
          els.a.setAttribute("r", R); els.a.setAttribute("cx", cx);
          els.b.setAttribute("r", R * 0.8); els.b.setAttribute("cx", cx - R * 0.08); els.b.setAttribute("cy", 540 - R * 0.06);
          els.c.setAttribute("r", R * 0.45); els.c.setAttribute("cx", cx - R * 0.2); els.c.setAttribute("cy", 540 - R * 0.16);
          const sr = A.rng(31);
          let spots = "";
          for (let i = 0; i < 9; i++) {
            const a = sr() * Math.PI * 2, q = 0.3 + sr() * 0.6, s = R * (0.05 + sr() * 0.07);
            const x = cx + Math.cos(a) * R * q * 0.9, y = 540 + Math.sin(a) * R * q * 0.9;
            spots += `M${(x - s).toFixed(1)} ${y.toFixed(1)}a${s.toFixed(1)} ${(s * 0.7).toFixed(1)} 0 1 0 ${(s * 2).toFixed(1)} 0a${s.toFixed(1)} ${(s * 0.7).toFixed(1)} 0 1 0 ${(-s * 2).toFixed(1)} 0Z`;

          els.kid.setAttribute("transform", `translate(560 ${790 + float}) rotate(-14) scale(0.52)`);

          els.burst.setAttribute("d", A.speedLines({ cx: 600, cy: 566, count: 120, inner: 200, seed: 1200 + frame, width: [2, 10] }));

        els.cam.style.transform = `translate(${s.x}px, ${s.y}px)`;
      });
      tl.fromTo("#aldebaran-ship", { scale: 0.62, x: 0, y: 0, svgOrigin: "0 0" }, { scale: 0.06, x: 150, y: -60, duration: 1.8, ease: "power2.in" }, 0);

          `<path d="M-160 -70 Q-210 200 -110 430 L-66 330 L-14 480 L38 330 L82 430 Q182 200 132 -70 Q-14 30 -160 -70Z" fill="#F7F4EA" ${ink(12)}/><path d="M-90 40 q20 140 0 260 M60 40 q-20 140 0 260" stroke="#B8B3A6" stroke-width="7" fill="none"/>`,

        if (t >= CHAOS && t < WHITE) return Math.floor((t - CHAOS) * 15) % 7;

          front[i].setAttribute("opacity", on ? 1 : 0);
          titles[i].setAttribute("opacity", on && t < CHAOS ? 1 : 0);

        const g = A.rng(800 + frame);
        els.dodo.setAttribute("transform", `translate(${(g() - 0.5) * 12} ${(g() - 0.5) * 12})`);
        if (t >= WHITE) $("final-lines").setAttribute("d", A.speedLines({ cx: 960, cy: 540, count: 120, inner: 560, seed: 3000 + frame, width: [1.5, 6] }));
        // The gauge climbs in sevens, then breaks.
        const step = Math.max(0, stage + 1);
        els.num.textContent = t >= CHAOS + 0.25 ? "∞" : GAUGE[t < CHAOS ? step : 7];
        els.fill.setAttribute("width", (t >= CHAOS ? 608 : 20 + step * 80).toFixed(0));
      });
      tl.fromTo("#transfo-gauge", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.5);
      tl.set("#transfo-gauge-crack", { opacity: 1 }, CHAOS + 0.25);

      tl.fromTo("#transfo-white", { attr: { r: 0 } }, { attr: { r: 2300 }, duration: 0.25, ease: "power2.in" }, WHITE);

    })();
