      <script>
(function () {

        cam.style.transform = `translate(${s.x}px, ${s.y}px)`;
      });
      tl.fromTo("#titre-words", { scale: 1.9, opacity: 0, transformOrigin: "830px 560px" }, { scale: 1, opacity: 1, duration: 0.14, ease: "expo.out" }, 0.12);
      tl.fromTo("#titre-flash", { opacity: 0 }, { opacity: 0.92, duration: 0.01 }, 0.12);
      tl.to("#titre-flash", { opacity: 0, duration: 0.01 }, 0.19);
      tl.fromTo("#titre-jp", { x: 360 }, { x: 0, duration: 0.3, ease: "expo.out" }, 0.4);
      tl.fromTo("#titre-band", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.28, ease: "power4.out" }, 0.5);

    <script>
(function () {
      const A = Anime;
      const tl = gsap.timeline({ paused: true });
      const $ = (k) => document.getElementById("e3t-" + k);
      const HEADS = ["serieux", "cri"];
      const ATTACK1 = 2.5, VAN = 3.0, ATTACK2 = 6.5, GAUGE = 11.2, SEVEN = 12.3;
      $("defs").innerHTML = A.stripes("e3t-hoodie", 52, 0);
      $("rig").innerHTML = A.rig("e3t-durif", { heads: HEADS, fill: "url(#e3t-hoodie)", hairColor: "#FFE14D" });
      const cr = A.rng(2014);
      const skins = ["#F2C29B", "#E0A57A", "#C98B5F", "#F6D3B3"], hairs = ["#3B2A1E", "#8A6239", "#C9C2B5", "#141018", "#B08A55"];
      let crowd = "";
      for (let row = 0; row < 4; row++) for (let i = 0; i < 16; i++) {
        for (const side of [0, 1]) {
          const x = (side ? 1260 : 20) + i * 40 + (row % 2) * 20 + cr() * 8, y = 610 + row * 42 + cr() * 6;
          crowd += `<circle cx="${x}" cy="${y}" r="21" fill="${skins[Math.floor(cr() * 4)]}" stroke="#141018" stroke-width="4"/><path d="M${x - 21} ${y - 4} q21 -30 42 0" fill="${hairs[Math.floor(cr() * 5)]}" stroke="#141018" stroke-width="4"/>`;
        }
      }
      $("crowd").innerHTML = crowd;
      $("van").innerHTML = `<g transform="translate(0 0)"><path d="M-170 -120 h250 q60 0 90 60 l30 60 v60 h-370Z" fill="#3FA34D" stroke="#141018" stroke-width="10" stroke-linejoin="round"/>
        <path d="M90 -110 l60 70 h-60Z" fill="#BFE6FF" stroke="#141018" stroke-width="7"/><path d="M-120 -120 q60 -110 150 -60 q-40 60 -150 60Z" fill="#7CE36A" stroke="#141018" stroke-width="8"/>
        <circle cx="-60" cy="-50" r="34" fill="#FFFDF5" stroke="#141018" stroke-width="6"/><path d="M-60 -78 q14 14 0 28 q-14 -14 0 -28Z M-88 -50 q14 -14 28 0 q-14 14 -28 0Z M-32 -50 q-14 -14 -28 0 q14 14 28 0Z M-60 -22 q14 -14 0 -28 q-14 14 0 28Z" fill="#FF8AB8"/>
        <circle cx="-110" cy="62" r="42" fill="#2B2B30" stroke="#141018" stroke-width="7"/><circle cx="130" cy="62" r="42" fill="#2B2B30" stroke="#141018" stroke-width="7"/></g>`;
      A.drive(tl, 13.3, (t) => {
        const frame = A.boil(t);
        const shouting = (t >= ATTACK1 && t < ATTACK1 + 3) || (t >= ATTACK2 && t < ATTACK2 + 4.5);
        A.face("e3t-durif", HEADS, shouting ? "cri" : "serieux");
        $("durif-hair").setAttribute("d", A.hair({ ...A.skull("neutre"), len: 1.75, up: 0.9, lift: 22, sharp: true, seed: 50 + (frame % 4) }));
        $("aura").setAttribute("d", A.flame({ cx: 960, cy: 770, rx: 150, ry: 180, n: 13, seed: frame * 3, amp: 0.3, up: 0.6 }));
        const since = Math.min(...[ATTACK1, ATTACK2, SEVEN].map((a) => (t >= a ? t - a : 9)));
        $("lines").setAttribute("d", A.speedLines({ cx: 960, cy: 520, count: 100, inner: 420, seed: 800 + frame, width: [2, 8] }));
        $("lines").setAttribute("opacity", Math.max(0, 0.7 - since * 1.4).toFixed(2));
        // The leaf ambulance crosses the ring.
        const run = Math.min(1, Math.max(0, (t - VAN) / 3.2));
        $("van").setAttribute("opacity", t >= VAN && run < 1 ? 1 : 0);
        $("van").setAttribute("transform", `translate(${2250 - run * 2700} ${905 + Math.sin(t * 30) * 4}) scale(-1.35 1.35)`);
        // Telepathy: dishes on the bald dome, rings towards the crowd.
        const tele = t >= ATTACK2 + 0.3 && t < GAUGE;
        $("dishes").setAttribute("opacity", tele ? 1 : 0);
        let waves = "";
        if (tele) for (let i = 0; i < 5; i++) {
          const rr = (((t - ATTACK2) * 420 + i * 160) % 800) + 40;
          waves += `<circle cx="960" cy="300" r="${rr.toFixed(1)}" fill="none" stroke="#FF8AB8" stroke-width="${Math.max(2, 16 - rr / 60).toFixed(1)}" opacity="${(1 - rr / 840).toFixed(2)}"/>`;
        }
        $("waves").innerHTML = waves;
        $("ticker-text").setAttribute("x", (1920 - Math.max(0, t - ATTACK2) * 1350).toFixed(1));
        // The votes spin up, then fall to seven.
        let votes = 0;
        if (t >= GAUGE && t < SEVEN) votes = Math.floor(Math.min(1, (t - GAUGE) / 0.75) * 248) + (frame % 3);
        if (t >= SEVEN) votes = 7;
        $("votes").textContent = String(Math.min(votes, 248));
        const s = A.shake(t, [{ at: ATTACK1, amp: 16 }, { at: VAN + 0.6, amp: 10 }, { at: ATTACK2, amp: 16 }, { at: SEVEN, amp: 34 }]);
        $("cam").style.transform = `translate(${s.x}px, ${s.y}px)`;
      });
      tl.fromTo("#e3t-box", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.25, ease: "power4.out" }, 0.2);
      tl.to("#e3t-box", { opacity: 0, duration: 0.15 }, 2.3);
      tl.fromTo("#e3t-name1", { opacity: 0, scale: 1.6, transformOrigin: "500px 600px" }, { opacity: 1, scale: 1, duration: 0.13, ease: "expo.out" }, ATTACK1);
      tl.to("#e3t-name1", { opacity: 0, duration: 0.12 }, ATTACK2 - 0.6);
      tl.fromTo("#e3t-ticker", { opacity: 0 }, { opacity: 1, duration: 0.08 }, ATTACK2);
      tl.to("#e3t-ticker", { opacity: 0, duration: 0.12 }, GAUGE - 0.2);
      tl.fromTo("#e3t-gauge", { opacity: 0, y: 200 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, GAUGE);
      tl.fromTo("#e3t-votes", { scale: 1 }, { scale: 1.6, duration: 0.06, transformOrigin: "1240px 950px", yoyo: true, repeat: 1 }, SEVEN);
      window.__timelines["e3-tournoi"] = tl;
    })();
    </script>
    <script>
(function () {
      const A = Anime;
      const tl = gsap.timeline({ paused: true });
      const $ = (k) => document.getElementById("e3s-" + k);
      const P = A.puppet("e3s-durif", { x: 1240, y: 1010, k: 1.05, faces: ["durif"] });
      $("puppet").innerHTML = P.markup;
      const DROP = 3.6;
      const jaw = document.getElementById("e3s-durif-jaw-durif");
      A.drive(tl, 8.5, (t) => {
        const r = A.rng(9100 + A.boil(t));
        A.pose("e3s-durif", P, { armFar: 8, armNear: 8, sway: (r() - 0.5) * 1.4 });
        if (t >= DROP) {
          const k = Math.min(1, (t - DROP) / 0.35);
          const fall = k * k * 175;
          const bounce = t > DROP + 0.35 ? Math.abs(Math.sin((t - DROP - 0.35) * 14)) * Math.exp(-(t - DROP - 0.35) * 6) * 40 : 0;
          const [px, py] = P.pivots.jaw.durif;
          jaw.setAttribute("transform", `translate(${k * 60} ${fall - bounce}) rotate(${k * 38} ${px} ${py})`);
        }
      });
      tl.fromTo("#e3s-cam", { scale: 2.1, x: -237, y: -636, svgOrigin: "0 0" }, { scale: 2.1, x: -237, y: -636, duration: 0.01 }, 0);
      tl.to("#e3s-cam", { scale: 1, x: 0, y: 0, duration: 0.7, ease: "power3.inOut" }, 2.0);
      window.__timelines["e3-salle"] = tl;
    })();
    </script>
