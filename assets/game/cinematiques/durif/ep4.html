      <script>
(function () {
      const tl = gsap.timeline({ paused: true });
      const burst = document.getElementById("titre-burst");
      const cam = document.getElementById("titre-cam");
      Anime.drive(tl, 2.2, (t) => {
        burst.setAttribute("d", Anime.sunburst({ cx: 830, cy: 560, count: 28, turn: t * 0.12 }));
        const s = Anime.shake(t, [{ at: 0.12, amp: 26 }]);
        cam.style.transform = `translate(${s.x}px, ${s.y}px)`;
      });
      tl.fromTo("#titre-words", { scale: 1.9, opacity: 0, transformOrigin: "830px 560px" }, { scale: 1, opacity: 1, duration: 0.14, ease: "expo.out" }, 0.12);
      tl.fromTo("#titre-flash", { opacity: 0 }, { opacity: 0.92, duration: 0.01 }, 0.12);
      tl.to("#titre-flash", { opacity: 0, duration: 0.01 }, 0.19);
      tl.fromTo("#titre-jp", { x: 360 }, { x: 0, duration: 0.3, ease: "expo.out" }, 0.4);
      tl.fromTo("#titre-band", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.28, ease: "power4.out" }, 0.5);
      window.__timelines["titre"] = tl;
    })();

    <script>
(function () {
      const A = Anime;
      const tl = gsap.timeline({ paused: true });
      const $ = (k) => document.getElementById("e4q-" + k);
      const MAP = 3.0, ZOOM = 8.0, VILLAIN = 10.0;
      const FR = [[0.42, 0], [0.6, 0.08], [0.8, 0.14], [0.95, 0.22], [0.9, 0.42], [0.85, 0.55], [0.96, 0.78], [0.8, 0.88], [0.62, 0.86], [0.55, 0.97], [0.35, 0.92], [0.22, 0.88], [0.28, 0.62], [0.2, 0.45], [0.02, 0.33], [0.18, 0.25], [0.3, 0.2], [0.38, 0.12]];
      const BOX = { x: 520, y: 210, s: 760 };
      const pts = FR.map(([x, y]) => [BOX.x + x * BOX.s, BOX.y + y * BOX.s]);
      $("france").setAttribute("d", "M" + pts.map((p) => p.join(" ")).join(" L") + "Z M" + (BOX.x + 0.97 * BOX.s) + " " + (BOX.y + 0.9 * BOX.s) + " l20 -40 l18 60 l-26 30Z");
      const inside = (x, y) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
      const sr = A.rng(500);
      const seals = [];
      while (seals.length < 500) { const x = BOX.x + sr() * BOX.s, y = BOX.y + sr() * BOX.s; if (inside(x, y)) seals.push([x, y, ["#2F5BD3", "#FFFDF5", "#C0262D"][seals.length % 3]]); }
      let gal = "";
      const gr = A.rng(77);
      for (let arm = 0; arm < 2; arm++) for (let i = 0; i < 90; i++) { const a = i * 0.11 + arm * Math.PI, rr = 20 + i * 5; const x = 960 + Math.cos(a) * rr + (gr() - 0.5) * 30, y = 540 + Math.sin(a) * rr * 0.55 + (gr() - 0.5) * 20; gal += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2 + gr() * 6).toFixed(1)}" fill="${gr() < 0.2 ? "#FFD23F" : "#FFF6D8"}"/>`; }
      $("galaxy").innerHTML = `<rect x="-60" y="-60" width="2040" height="1200" fill="#1E1A3A"/>${A.stars({ count: 120, seed: 9 })}<ellipse cx="960" cy="540" rx="120" ry="70" fill="#FFF3B0" stroke="#141018" stroke-width="8"/>${gal}<circle cx="960" cy="540" r="10" fill="#C0262D" stroke="#FFFDF5" stroke-width="4"/>`;
      $("durif").innerHTML = A.rig("e4q-d", { heads: ["cri"], fill: "url(#transfo-hoodie-e4)", hairColor: "#FFE14D" });
      document.getElementById("e4q-d-b-arm-r").setAttribute("transform", "rotate(-125 120 40)");
      $("durif").insertAdjacentHTML("afterbegin", `<defs>${A.stripes("transfo-hoodie-e4", 52, 0)}</defs>`);
      A.drive(tl, 13.0, (t) => {
        const frame = A.boil(t);
        $("lines").setAttribute("d", A.speedLines({ cx: 960, cy: 540, count: 90, inner: 520, seed: 1500 + frame, width: [1.5, 6] }));
        // The ship crosses France; the seals under its radar go out.
        const fly = Math.min(1, Math.max(0, (t - MAP - 0.3) / 4.2));
        const shipX = 300 + fly * 1250, shipY = 420 + Math.sin(fly * Math.PI) * -120;
        $("ship").setAttribute("transform", `translate(${shipX} ${shipY}) scale(0.42)`);
        let d = "";
        for (const [x, y, c] of seals) if (x > shipX + 40 || t < MAP) d += `M${(x - 6).toFixed(1)} ${y.toFixed(1)}a6 6 0 1 0 12 0a6 6 0 1 0 -12 0Z`;
        $("seals").setAttribute("d", d);
        $("seals").setAttribute("fill", "#C0262D");
        $("seals").setAttribute("stroke", "#141018");
        $("seals").setAttribute("stroke-width", "2");
        const a = t * 4;
        $("radar-sweep").setAttribute("d", `M1690 830 L${1690 + Math.cos(a) * 185} ${830 + Math.sin(a) * 185} A185 185 0 0 1 ${1690 + Math.cos(a + 0.6) * 185} ${830 + Math.sin(a + 0.6) * 185}Z`);
        $("sweep").setAttribute("d", `M${shipX} ${shipY + 40} L${shipX - 130} 1080 L${shipX + 130} 1080Z`);
        $("count-text").textContent = t >= ZOOM ? "GALAXIE : 0 / 500" : "SCEAUX : 0 / 500";
        $("d-hair").setAttribute("d", A.hair({ ...A.skull("neutre"), len: 1.75, up: 0.9, lift: 22, sharp: true, seed: 60 + (frame % 4) }));
        $("villain-burst").setAttribute("d", A.sunburst({ cx: 960, cy: 400, count: 24, turn: t * 0.3 }));
        const s = A.shake(t, [{ at: VILLAIN, amp: 30 }, { at: MAP, amp: 10 }]);
        $("cam").style.transform = `translate(${s.x}px, ${s.y}px)`;
      });
      tl.fromTo("#e4q-box", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.25, ease: "power4.out" }, 0.15);
      tl.to("#e4q-box", { opacity: 0, duration: 0.15 }, 2.6);
      tl.fromTo("#e4q-scroll", { scaleY: 0.05, transformOrigin: "960px 540px" }, { scaleY: 1, duration: 0.45, ease: "expo.out" }, 0.1);
      tl.to("#e4q-scroll", { opacity: 0, duration: 0.15 }, MAP);
      tl.to("#e4q-bg", { attr: { fill: "#7FC4F0" }, duration: 0.01 }, MAP);
      tl.fromTo(["#e4q-map", "#e4q-ship", "#e4q-radar", "#e4q-count"], { opacity: 0 }, { opacity: 1, duration: 0.15 }, MAP);
      tl.to("#e4q-map", { scale: 0.02, transformOrigin: "960px 540px", duration: 0.9, ease: "power3.in" }, ZOOM);
      tl.to("#e4q-ship", { opacity: 0, duration: 0.2 }, ZOOM);
      tl.fromTo("#e4q-galaxy", { opacity: 0, scale: 4, transformOrigin: "960px 540px" }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, ZOOM + 0.5);
      tl.to(["#e4q-radar", "#e4q-count", "#e4q-galaxy"], { opacity: 0, duration: 0.05 }, VILLAIN);
      tl.fromTo("#e4q-villain", { opacity: 0 }, { opacity: 1, duration: 0.05 }, VILLAIN);
      tl.fromTo("#e4q-durif", { opacity: 0, x: -700 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, VILLAIN + 0.7);
      window.__timelines["e4-quete"] = tl;
    })();
    </script>
    <script>
(function () {
      const A = Anime;
      const tl = gsap.timeline({ paused: true });
      const $ = (k) => document.getElementById("e4e-" + k);
      const P = A.puppet("e4e-durif", { x: 0, y: 1000, k: 0.95, faces: ["durif", "durif.aie"] });
      $("puppet").innerHTML = P.markup;
      const STOP = 3.0, LOOSE = 4.6;
      A.drive(tl, 7.6, (t) => {
        const walking = t < STOP;
        const x = -260 + Math.min(t, STOP) / STOP * 1080;
        const step = Math.sin(t * 9);
        const r = A.rng(5200 + A.boil(t));
        A.pose("e4e-durif", P, { legFar: walking ? step * 16 : 0, legNear: walking ? -step * 16 : 0, armFar: walking ? -step * 10 : 6, armNear: 4, face: t > LOOSE + 0.3 ? "durif.aie" : "durif", sway: (r() - 0.5) * 1.4, dy: walking ? -Math.abs(step) * 10 : 0 });
        $("walker").setAttribute("transform", `translate(${x.toFixed(1)} 0)`);
        $("case").setAttribute("transform", `translate(${P.pivots.armnear[0] + 40} ${t < STOP + 0.2 ? 930 + (walking ? Math.abs(step) * -8 : 0) : 950})`);
        let w = "";
        for (let i = 0; i < 9; i++) { const xx = ((i * 260 + t * 60) % 2200) - 140, yy = 610 + (i % 3) * 60; w += `M${xx} ${yy} q30 -20 60 0 q30 20 60 0`; }
        $("waves").setAttribute("d", w);
        const fly = Math.max(0, t - LOOSE);
        $("sheet").setAttribute("opacity", t >= LOOSE ? 1 : 0);
        $("sheet").setAttribute("transform", `translate(${(1000 + fly * 260).toFixed(1)} ${(800 - fly * 160 + Math.sin(fly * 5) * 30).toFixed(1)}) rotate(${(fly * 120).toFixed(1)}) scale(${(1 - Math.min(0.5, fly * 0.12)).toFixed(3)})`);
      });
      tl.fromTo("#e4e-box", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.25, ease: "power4.out" }, 0.3);
      window.__timelines["e4-exil"] = tl;
    })();
    </script>
