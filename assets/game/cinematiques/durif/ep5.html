      <script>

    <script>
(function () {
      const A = Anime;
      const tl = gsap.timeline({ paused: true });
      const $ = (k) => document.getElementById("e5r-" + k);
      const SHIP = 2.6, LIFT = 4.8, COMBINE = 6.4, RULE = 9.4, TAKE = 9.8, GONE = 11.0, BACK = 11.8;
      $("defs").innerHTML = A.stripes("e5r-hoodie", 52, 0);
      $("stars").innerHTML = A.stars({ count: 110, seed: 2023, h: 700 });
      $("driver").innerHTML = `<g transform="translate(-40 -86) scale(0.17)">${A.headImage("e5r-driver-face", "serieux", null, true)}</g>`;
      $("head").innerHTML = `<path id="e5r-hair" fill="#FFE14D" stroke="#141018" stroke-width="13" stroke-linejoin="round"/>${A.headImage("e5r-face", "cri", null, true)}`;
      const V = A.puppet("e5r-chem", { x: 0, y: 0, k: 0.5, faces: ["cheminade"], body: "../../corps/societe_civile.webp" });
      $("victim").innerHTML = V.markup;
      A.drive(tl, 14.0, (t) => {
        const frame = A.boil(t);
        let dashes = "", posts = "";
        for (let i = 0; i < 9; i++) { const x = ((i * 260 - t * 900) % 2340 + 2340) % 2340 - 210; dashes += `M${x} 920 h140`; }
        for (let i = 0; i < 4; i++) { const x = ((i * 640 - t * 900) % 2560 + 2560) % 2560 - 320; posts += `M${x} 760 V430 h90`; }
        $("dashes").setAttribute("d", dashes);
        $("posts").setAttribute("d", t < LIFT ? posts : "");
        let lights = "";
        for (let i = 0; i < 14; i++) { const x = 300 + i * 95; lights += `<circle cx="${x}" cy="${300 + Math.sin((x - 960) / 700) * 20}" r="16" fill="${(i + frame) % 3 === 0 ? "#FFFDF5" : "#C0262D"}" stroke="#141018" stroke-width="5"/>`; }
        $("ship-lights").innerHTML = lights;
        const rise = Math.min(1, Math.max(0, (t - LIFT - 0.2) / 1.3));
        $("car").setAttribute("transform", `translate(960 ${(860 - rise * rise * 560 + (t < LIFT ? Math.sin(t * 22) * 3 : 0)).toFixed(1)}) rotate(${(rise * 25).toFixed(1)})`);
        $("burst").setAttribute("d", A.sunburst({ cx: 960, cy: 470, count: 26, turn: t * 0.6 }));
        $("lines").setAttribute("d", A.speedLines({ cx: 960, cy: 470, count: 90, inner: 560, seed: 1700 + frame, width: [2, 7] }));
        $("hair").setAttribute("d", A.hair({ ...A.skull("cri"), len: 1.8, up: 0.9, lift: 22, sharp: true, seed: 90 + (frame % 4) }));
        // The rule: the robot takes your weakest politician and gives it back in gold.
        const taking = t >= TAKE && t < GONE, back = t >= BACK;
        const up = taking ? Math.min(1, (t - TAKE) / 1.0) : 0;
        const down = back ? Math.min(1, (t - BACK) / 0.5) : 0;
        const vy = back ? 640 + down * 340 : 980 - up * 560;
        $("victim").setAttribute("transform", `translate(330 ${vy.toFixed(1)}) rotate(${taking ? up * 40 : 0})`);
        $("victim").setAttribute("opacity", t >= RULE && (t < GONE || back) ? 1 : 0);
        $("victim").setAttribute("filter", back ? "url(#e5r-gold)" : "");
        $("ray").setAttribute("opacity", taking || (back && down < 1) ? 0.85 : 0);
        $("ray").setAttribute("d", "M1320 670 L1360 705 L450 1000 L210 1000Z");
        let sp = "";
        if (back) for (let i = 0; i < 8; i++) { const a = i * 0.8 + t * 2, rr = 170 + (i % 2) * 40, x = 330 + Math.cos(a) * rr, y = 820 + Math.sin(a) * rr * 0.8, s = 18 + ((i + frame) % 3) * 6; sp += `<path d="M${x} ${y - s * 2} Q${x} ${y} ${x + s * 2} ${y} Q${x} ${y} ${x} ${y + s * 2} Q${x} ${y} ${x - s * 2} ${y} Q${x} ${y} ${x} ${y - s * 2}Z" fill="#FFD23F" stroke="#141018" stroke-width="5"/>`; }
        $("sparks").innerHTML = sp;
        const s = A.shake(t, [{ at: SHIP + 0.5, amp: 14 }, { at: COMBINE, amp: 34 }, { at: BACK + 0.5, amp: 14 }]);
        $("cam").style.transform = `translate(${s.x}px, ${s.y}px)`;
      });
      tl.fromTo("#e5r-box1", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.25, ease: "power4.out" }, 0.2);
      tl.to("#e5r-box1", { opacity: 0, duration: 0.12 }, SHIP);
      tl.fromTo("#e5r-ship", { y: -520 }, { y: 0, duration: 1.0, ease: "power3.out" }, SHIP);
      tl.fromTo("#e5r-size", { opacity: 0 }, { opacity: 1, duration: 0.1 }, SHIP + 0.8);
      tl.to("#e5r-size", { opacity: 0, duration: 0.1 }, LIFT);
      tl.fromTo("#e5r-beam", { opacity: 0 }, { opacity: 0.6, duration: 0.1 }, LIFT);
      tl.set("#e5r-flash", { opacity: 1 }, COMBINE - 0.1);
      tl.set("#e5r-robot", { opacity: 1 }, COMBINE - 0.1);
      tl.to("#e5r-flash", { opacity: 0, duration: 0.25 }, COMBINE);
      tl.fromTo("#e5r-mecha", { scale: 1.6, y: 300, transformOrigin: "960px 700px" }, { scale: 1, y: 0, duration: 0.4, ease: "back.out(1.4)" }, COMBINE);
      tl.fromTo("#e5r-name", { opacity: 0, scale: 1.6, transformOrigin: "500px 200px" }, { opacity: 1, scale: 1, duration: 0.13, ease: "expo.out" }, COMBINE + 0.3);
      tl.to("#e5r-name", { opacity: 0, duration: 0.12 }, RULE);
      tl.to("#e5r-mecha", { x: 380, scale: 0.8, transformOrigin: "960px 1040px", duration: 0.5, ease: "power2.inOut" }, RULE - 0.3);
      tl.fromTo("#e5r-box2", { opacity: 0 }, { opacity: 1, duration: 0.12 }, TAKE);
      tl.to("#e5r-box2", { opacity: 0, duration: 0.12 }, BACK - 0.1);
      tl.fromTo("#e5r-box3", { opacity: 0 }, { opacity: 1, duration: 0.12 }, BACK + 0.2);
      window.__timelines["e5-robot"] = tl;
    })();
    </script>
    <script>
(function () {
      const A = Anime;
      const tl = gsap.timeline({ paused: true });
      const $ = (k) => document.getElementById("e5a-" + k);
      $("stars").innerHTML = A.stars({ count: 70, seed: 300, h: 640 });
      $("car").innerHTML = A.paperCar();
      const P = A.puppet("e5a-durif", { x: 820, y: 1000, k: 1, faces: ["durif"] });
      $("puppet").innerHTML = P.markup;
      A.drive(tl, 8.0, (t) => {
        const r = A.rng(6100 + A.boil(t));
        const lift = Math.min(1, Math.max(0, (t - 0.6) / 0.3));
        A.pose("e5a-durif", P, { armNear: lift * 150, armFar: 6, sway: (r() - 0.5) * 1.4 });
        const [px, py] = P.pivots.armnear;
        const a = (-lift * 150 + 90) * Math.PI / 180;
        const hx = px + Math.cos(a) * 95, hy = py + Math.sin(a) * 95;
        const tx = hx + lift * 190, ty = hy - lift * 250;
        $("stick").setAttribute("d", `M${hx.toFixed(1)} ${hy.toFixed(1)} L${tx.toFixed(1)} ${ty.toFixed(1)}`);
        $("phone").setAttribute("transform", `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${(-lift * 25).toFixed(1)})`);
        $("plane").setAttribute("cx", (300 + t * 140).toFixed(1));
        $("plane").setAttribute("cy", "150");
